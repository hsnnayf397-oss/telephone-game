<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>تلفون مكسور</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#13112b;--card:#201c48;--ink:#f6f3ff;--pink:#ff4d94;--yel:#ffd23f;--cyan:#35e0ff;--line:#4a4496;--mut:#a9a4d8}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;min-height:100vh;
background:radial-gradient(circle at 85% 0,#2d1f6e 0,transparent 45%),radial-gradient(#2a2660 1.5px,transparent 1.5px) 0 0/26px 26px,var(--bg)}
.screen{max-width:560px;margin:0 auto;padding:26px 16px 60px;display:flex;flex-direction:column;gap:14px}
.screen[hidden]{display:none}
h1,h2,.f{font-family:'Lalezar','IBM Plex Sans Arabic',sans-serif;font-weight:400;margin:0}
h1{font-size:76px;line-height:1.05;color:var(--yel);text-shadow:4px 4px 0 var(--pink);transform:rotate(-2deg);align-self:flex-start}
h2{font-size:32px}
p{margin:0}.mut{color:var(--mut)}
input{font:inherit;padding:13px 15px;border:3px solid var(--line);border-radius:14px;background:#171437;color:var(--ink);width:100%}
input:focus{border-color:var(--cyan);outline:none}
button{font:inherit;font-weight:600;padding:12px 18px;border:3px solid #000;border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 0 0 #000}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button.go{background:var(--pink);color:#fff;font-size:19px}
button:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{color:#ff8fa3;min-height:1.3em}
.box{background:var(--card);border:3px solid #000;border-radius:18px;box-shadow:5px 5px 0 var(--pink);padding:14px}
.code{font-family:'Lalezar',sans-serif;font-size:64px;letter-spacing:.2em;direction:ltr;text-align:center;color:#000;background:var(--yel);border:3px solid #000;border-radius:18px;box-shadow:5px 5px 0 var(--cyan)}
.pl{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid #000;border-radius:999px;padding:6px 16px 6px 12px;font-weight:600;animation:pop .35s}
.chip b{font-size:26px}
.bar{display:flex;justify-content:space-between;align-items:center}
.tm{font-family:'Lalezar';font-size:34px;direction:ltr;color:var(--yel)}
.tb{height:12px;background:#171437;border:3px solid #000;border-radius:99px;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:var(--cyan);transition:width 1s linear,background .3s}
.tb.low i{background:var(--pink)}
.prompt{font-family:'Lalezar';font-size:34px;line-height:1.3;word-break:break-word}
.paper{width:100%;border:3px solid #000;border-radius:14px;background:#fff;display:block}
#cv{aspect-ratio:4/3;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;padding:0;border-radius:50%;box-shadow:0 3px 0 #000}
.on{outline:3px solid var(--cyan);outline-offset:2px}
.tool{padding:8px 12px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--pink);width:110px}
input[type=color]{width:40px;height:36px;padding:0;border-radius:10px;cursor:pointer}
.big{font-family:'Lalezar';font-size:84px;text-align:center;color:var(--cyan);direction:ltr}
.entry{display:flex;flex-direction:column;gap:8px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.by{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut)}.by b{font-size:24px}
.txt{font-family:'Lalezar';font-size:30px;word-break:break-word}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section class="screen" id="home">
  <h1>تلفون مكسور</h1>
  <p class="mut">اكتب، ارسم، وشوف كيف تتخربط الفكرة بين الربع.</p>
  <input id="name" placeholder="اسمك" maxlength="16" autocomplete="off">
  <button class="go" id="create">سوّ غرفة جديدة</button>
  <div class="row">
    <input id="code" placeholder="رمز الغرفة" maxlength="4" style="direction:ltr;text-transform:uppercase">
    <button id="join">ادخل الغرفة</button>
  </div>
  <p class="err" id="homeErr"></p>
</section>

<section class="screen" id="lobby" hidden>
  <h2>شارك الرمز مع أصحابك</h2>
  <div class="code" id="lobbyCode"></div>
  <div class="pl" id="players"></div>
  <button class="go" id="start">ابدأ اللعبة</button>
  <p class="mut" id="lobbyHint"></p>
  <p class="err" id="lobbyErr"></p>
</section>

<section class="screen" id="task" hidden>
  <div class="bar"><span id="round" class="mut"></span><span class="tm" id="timer"></span></div>
  <div class="tb" id="tb"><i></i></div>
  <h2 id="title"></h2>
  <div id="promptBox"></div>
  <input id="text" maxlength="120" autocomplete="off">
  <div id="drawBox">
    <canvas id="cv" class="paper" width="640" height="480"></canvas>
    <div class="tools" id="tools"></div>
  </div>
  <button class="go" id="send">خلصت، أرسل</button>
  <p class="mut" id="prog1"></p>
</section>

<section class="screen" id="wait" hidden>
  <h2>وصلت، ننتظر الباقين</h2>
  <div class="big" id="prog2"></div>
</section>

<section class="screen" id="reveal" hidden>
  <h2 id="rvTitle">جاهزين للكشف؟</h2>
  <div id="chain" style="display:flex;flex-direction:column;gap:16px"></div>
  <button class="go" id="next" hidden>ابدأ الكشف</button>
  <p class="mut" id="rvHint"></p>
  <button id="again" hidden>العب مرة ثانية</button>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(), $ = s => document.querySelector(s);
const show = id => document.querySelectorAll('.screen').forEach(e => e.hidden = e.id !== id);
const AV = ['🦊','🐙','🦄','🐸','🐼','🦁','🐧','🦖','👾','🐝','🦉','🐢'];
let hostId = null, avMap = {}, chains = [];
const amHost = () => socket.id === hostId;
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

// ---------- أصوات وقصاصات ----------
let ac;
const beep = (f, d = .12, type = 'triangle') => { try {
  ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(ac.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d);
} catch {} };
function confetti() {
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#ff4d94', '#ffd23f', '#35e0ff', '#8cff6b'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height * .6,
    vx: Math.random() * 4 - 2, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8, c: cols[Math.random() * 4 | 0] }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; x.fillStyle = p.c; x.fillRect(p.x, p.y, p.s, p.s * .6); });
    if (f++ < 260) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}

// ---------- الرئيسية والغرفة ----------
const enter = (ev, payload) => socket.emit(ev, payload, r => { if (!r.ok) $('#homeErr').textContent = r.error; });
$('#create').onclick = () => enter('create', $('#name').value);
$('#join').onclick = () => enter('join', { name: $('#name').value, code: $('#code').value });

socket.on('lobby', d => {
  show('lobby'); hostId = d.hostId; avMap = {};
  $('#lobbyCode').textContent = d.code;
  $('#players').replaceChildren(...d.players.map((n, i) => {
    avMap[n] = AV[i % AV.length];
    const c = el('div', 'chip'); c.append(el('b', '', avMap[n]), el('span', '', n)); return c;
  }));
  $('#start').hidden = !amHost();
  $('#lobbyHint').textContent = amHost() ? 'الأفضل 4 لاعبين أو أكثر، وكل ما زادوا صارت أضحك.' : 'ننتظر المضيف يبدأ اللعبة…';
  beep(660, .1);
});
$('#start').onclick = () => socket.emit('start', r => { if (!r.ok) $('#lobbyErr').textContent = r.error; });
socket.on('host', id => { hostId = id; syncReveal(); });

// ---------- لوحة الرسم ----------
const cv = $('#cv'), ctx = cv.getContext('2d');
const COLORS = ['#000000','#ffffff','#e5383b','#ff9f1c','#ffd23f','#8cd447','#2ec4b6','#3b4cff','#9b5de5','#ff4d94','#8d5a3b','#9aa0a6'];
let color = '#000000', size = 8, tool = 'pen', drawing = false, hist = [];
ctx.lineCap = ctx.lineJoin = 'round';

function clearCanvas() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); hist = []; }
const snap = () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 15) hist.shift(); };
const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };

function fill(sx, sy, hex) {
  const w = cv.width, h = cv.height, img = ctx.getImageData(0, 0, w, h), d = img.data;
  const i0 = (sy * w + sx) * 4, tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const seen = new Uint8Array(w * h), st = [sy * w + sx];
  while (st.length) {
    const p = st.pop(); if (seen[p]) continue; seen[p] = 1;
    const i = p * 4;
    if (Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) > 60) continue;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    const x = p % w;
    if (x > 0) st.push(p - 1); if (x < w - 1) st.push(p + 1);
    if (p >= w) st.push(p - w); if (p < w * (h - 1)) st.push(p + w);
  }
  ctx.putImageData(img, 0, 0);
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); snap();
  const [x, y] = pt(e);
  if (tool === 'fill') return fill(Math.round(x), Math.round(y), color);
  drawing = true; ctx.strokeStyle = tool === 'eraser' ? '#fff' : color; ctx.lineWidth = size;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .01, y); ctx.stroke();
});
cv.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => drawing = false));

function buildTools() {
  const box = $('#tools'); box.replaceChildren();
  COLORS.forEach(c => {
    const b = el('button', 'sw' + (c === color && tool !== 'eraser' ? ' on' : '')); b.style.background = c;
    b.setAttribute('aria-label', 'لون'); b.onclick = () => { color = c; if (tool === 'eraser') tool = 'pen'; buildTools(); };
    box.append(b);
  });
  const pick = el('input'); pick.type = 'color'; pick.value = color; pick.setAttribute('aria-label', 'لون مخصص');
  pick.oninput = () => { color = pick.value; if (tool === 'eraser') tool = 'pen'; };
  box.append(pick);
  [['pen', '✏️ قلم'], ['fill', '🪣 تعبئة'], ['eraser', '🧽 ممحاة']].forEach(([t, l]) => {
    const b = el('button', 'tool' + (tool === t ? ' on' : ''), l); b.onclick = () => { tool = t; buildTools(); }; box.append(b);
  });
  const rg = el('input'); rg.type = 'range'; rg.min = 2; rg.max = 44; rg.value = size; rg.setAttribute('aria-label', 'سمك الخط');
  rg.oninput = () => size = +rg.value;
  const undo = el('button', 'tool', '↩️ تراجع'); undo.onclick = () => { const h = hist.pop(); if (h) ctx.putImageData(h, 0, 0); };
  const wipe = el('button', 'tool', '🗑️ مسح'); wipe.onclick = () => { snap(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); };
  box.append(rg, undo, wipe);
}

// ---------- الجولات ----------
let timerId = null, sent = false, current = null;
socket.on('progress', p => {
  const t = `خلّص ${p.done} من ${p.total}`;
  $('#prog1').textContent = t; $('#prog2').textContent = `${p.done} / ${p.total}`;
  if (p.done) beep(500 + p.done * 40, .08);
});
socket.on('task', t => {
  clearInterval(timerId); current = t; sent = false;
  show('task'); beep(740, .15);
  $('#round').textContent = `الجولة ${t.round} من ${t.total}`;
  const pb = $('#promptBox'); pb.replaceChildren();
  const isDraw = t.type === 'draw';
  $('#drawBox').hidden = !isDraw; $('#text').hidden = isDraw; $('#text').value = '';
  if (isDraw) {
    clearCanvas(); buildTools();
    $('#title').textContent = 'ارسم هذي:';
    pb.append(el('div', 'box prompt', t.prompt || '(ما كتب شي، ارسم اللي تبيه)'));
  } else if (t.prompt === null) {
    $('#title').textContent = 'اكتب فكرة يرسمونها';
    $('#text').placeholder = 'مثل: قطة تركب دراجة';
  } else if (t.prompt) {
    $('#title').textContent = 'وش تشوف في الرسمة؟';
    const img = el('img', 'paper'); img.src = t.prompt; pb.append(img);
    $('#text').placeholder = 'اكتب وصفك هنا';
  } else {
    $('#title').textContent = 'الرسمة فاضية، اكتب من خيالك';
    $('#text').placeholder = 'اكتب أي شي';
  }
  let left = t.seconds; const tb = $('#tb');
  const tick = () => {
    $('#timer').textContent = left; tb.firstElementChild.style.width = (left / t.seconds * 100) + '%';
    tb.classList.toggle('low', left <= 10);
    if (left > 0 && left <= 5) beep(880, .06);
    if (left-- <= 0) { clearInterval(timerId); submit(); }
  };
  tb.firstElementChild.style.transition = 'none'; tb.firstElementChild.style.width = '100%';
  requestAnimationFrame(() => { tb.firstElementChild.style.transition = ''; tick(); timerId = setInterval(tick, 1000); });
});
function submit() {
  if (sent || !current) return;
  sent = true; clearInterval(timerId);
  socket.emit('submit', current.type === 'draw' ? cv.toDataURL('image/png') : $('#text').value);
  show('wait');
}
$('#send').onclick = submit;
$('#text').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

// ---------- الكشف (يقوده المضيف) ----------
let started = false;
function syncReveal() {
  const host = amHost();
  $('#next').hidden = !host || $('#again').hidden === false;
  $('#rvHint').textContent = host ? '' : 'المضيف يكشف النتيجة، استعد تضحك 😂';
}
socket.on('reveal', c => {
  clearInterval(timerId); current = null; chains = c; started = false;
  show('reveal'); $('#chain').replaceChildren(); $('#again').hidden = true;
  $('#rvTitle').textContent = 'جاهزين للكشف؟'; $('#next').textContent = 'ابدأ الكشف';
  syncReveal(); beep(520, .2);
});
socket.on('step', ({ k, i }) => {
  const c = chains[k], box = $('#chain');
  if (i === 0) { box.replaceChildren(); $('#rvTitle').textContent = `سلسلة ${avMap[c.owner] || '🎨'} ${c.owner}`; }
  const en = c.entries[i], card = el('div', 'box entry');
  const by = el('div', 'by'); by.append(el('b', '', avMap[en.by] || '🎨'), el('span', '', en.by)); card.append(by);
  if (en.type === 'image' && en.content) { const im = el('img', 'paper'); im.src = en.content; card.append(im); }
  else card.append(el('div', 'txt', en.content || '(فاضي)'));
  box.append(card); card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  beep(420 + i * 70, .15);
  $('#next').textContent = 'التالي';
});
socket.on('end', () => {
  $('#rvTitle').textContent = 'انتهت اللعبة! 🎉'; $('#next').hidden = true;
  $('#again').hidden = !amHost(); $('#rvHint').textContent = amHost() ? '' : 'ننتظر المضيف يبدأ جولة جديدة…';
  confetti(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .25), i * 130));
});
$('#next').onclick = () => socket.emit('next');
$('#again').onclick = () => socket.emit('restart');
</script>
</body>
</html>
